name: CI

on:
  push:
  pull_request:

jobs:
  core:
    # Ядро проекта не зависит от pgmpy -- эта джоба доказывает это явно,
    # устанавливая всё, КРОМЕ pgmpy.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Установка зависимостей без pgmpy
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn matplotlib pytest
      - name: Тесты, не требующие pgmpy
        run: pytest tests/test_reference.py tests/test_new_modules.py tests/test_scripts_and_app.py -v
      - name: Сверка с Табл. 3.6 диплома
        run: python -m scripts.verify_reference
      - name: Предобработка и пересчёт PRIOR отрабатывают на синтетической выгрузке
        # Скрипт запускается вручную и редко, поэтому ломается незаметно.
        run: |
          python -c "
          import numpy as np
          from src.model import BayesNet
          from src.network_spec import ROOTS
          df = BayesNet.from_spec().sample(500, np.random.default_rng(0))[list(ROOTS)]
          df['nomer_uzla'] = np.repeat(np.arange(50), 10)
          df.to_csv('/tmp/ci_vygruzka.csv', index=False)
          "
          python -m scripts.fit_priors /tmp/ci_vygruzka.csv --object-col nomer_uzla

      - name: Все ячейки ноутбуков выполняются без ошибок
        # Ноутбуки лежат в репозитории собранными; эта проверка ловит случай,
        # когда правка в src/ ломает повествование, а .ipynb остался старым.
        run: python -m scripts.build_notebooks --check

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установка всех зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Версия pgmpy (фиксируется в логе сборки)
        run: python -c "import pgmpy; print('pgmpy', getattr(pgmpy, '__version__', 'unknown'))"
      - name: Все тесты
        run: pytest -v -rs
      - name: pgmpy-тесты обязаны выполниться, а не пропуститься
        # Иначе зелёный бейдж означал бы «прошли только numpy-тесты»:
        # importorskip молча скипает весь модуль, если pgmpy сломан импортом.
        run: |
          pytest tests/test_network_pgmpy.py tests/test_learning.py -q -rs | tee /tmp/pgmpy.log
          if grep -qi "skipped" /tmp/pgmpy.log; then
            echo "::error::pgmpy-тесты были пропущены -- pgmpy не установлен или несовместим"
            exit 1
          fi
